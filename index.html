<!DOCTYPE html>

  <head>

    <!-- Limpiar Service Workers del dominio anterior (main app PWA) -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) { reg.unregister(); });
        });
        // Limpiar caches del SW anterior
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
        }
      }
    </script>

    <!-- SEO -->
    <title>BullWeb Chile — Sistema POS para Restaurantes | KDS, Delivery y Boletas DTE</title>

    />
