# ==========================================================================
# Landing Page - www.bullwebchile.com
# Incluye soporte de prerendering para SEO (bots de buscadores).
# ==========================================================================

# --- Detección de bots/crawlers (nivel http) -------------------------------
# $prerender_bot = 1 si el User-Agent corresponde a un crawler conocido.
map $http_user_agent $prerender_bot {
    default                  0;
    ~*bot                    1;
    ~*crawl                 1;
    ~*spider                1;
    ~*slurp                 1;
    ~*Googlebot             1;
    ~*Bingbot               1;
    ~*YandexBot             1;
    ~*Baiduspider           1;
    ~*facebookexternalhit   1;
    ~*Twitterbot            1;
    ~*LinkedInBot           1;
    ~*WhatsApp              1;
    ~*TelegramBot           1;
    ~*Discordbot            1;
    ~*Applebot              1;
    ~*SkypeUriPreview       1;
    ~*Slack-ImgProxy        1;
    ~*AhrefsBot             1;
    ~*SemrushBot            1;
    ~*MJ12bot               1;
    ~*Mediapartners-Google  1;
    ~*AdsBot-Google         1;
    ~*Wappalyzer            1;
    ~*Prerender             1;
}

# --- Mapeo de rutas a archivos prerenderizados ----------------------------
# $prerender_file = ruta (relativa al root) del HTML prerender para esta URI,
# o "_prerender_none_" si la ruta no tiene prerender (placeholder inexistente).
map $uri $prerender_file {
    default                 "_prerender_none_";
    /                       "/prerendered/index.html";
    /index.html             "/prerendered/index.html";
    /funciones              "/prerendered/funciones.html";
    /funciones.html         "/prerendered/funciones.html";
    /precios                "/prerendered/precios.html";
    /precios.html           "/prerendered/precios.html";
    /faq                    "/prerendered/faq.html";
    /faq.html               "/prerendered/faq.html";
}

# --- $prerender_check: combina bot + ruta ----------------------------------
# Solo conserva el path prerender si (a) es bot (empieza con "1") Y
# (b) hay prerender para la ruta (el valor combinado sigue el patrón
# "1/prerendered/..."). En cualquier otro caso devuelve un placeholder
# inexistente en disco para que try_files continúe con el siguiente argumento.
map $prerender_bot$prerender_file $prerender_check {
    default                 "_prerender_none_";
    "~^1/prerendered/"      $prerender_file;
}

# --- Redirección HTTP -> HTTPS (www) ---------------------------------------
server {
    listen 80;
    server_name bullwebchile.com www.bullwebchile.com;
    return 301 https://www.bullwebchile.com$request_uri;
}

# --- Redirección HTTPS apex -> www -----------------------------------------
server {
    listen 443 ssl http2;
    server_name bullwebchile.com;

    ssl_certificate     /etc/letsencrypt/live/bullwebchile.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bullwebchile.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.bullwebchile.com$request_uri;
}

# --- Servidor principal: www.bullwebchile.com ------------------------------
server {
    listen 443 ssl http2;
    server_name www.bullwebchile.com;

    ssl_certificate     /etc/letsencrypt/live/bullwebchile.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bullwebchile.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/bullweb-landing;
    index index.html;

    # index.html - nunca cachear (forzar actualizaciones)
    location = /index.html {
        add_header Cache-Control no-store always;
        add_header Pragma no-cache always;
        add_header Surrogate-Control no-store always;
        expires 0;
    }

    # Assets con hash (Vite) - cache inmutable 1 año
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control public always;
        access_log off;
    }

    # Bloquear acceso directo a la carpeta de prerenders (solo uso interno)
    location ^~ /prerendered/ {
        internal;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Prerender "1" always;
        access_log off;
    }

    # --- Servir prerender a bots, fallback SPA al resto ---------------------
    # try_files prueba en orden:
    #   1. $prerender_check (path prerender solo si es bot + ruta mapeada)
    #   2. $uri (archivo estático real)
    #   3. $uri/ (directorio)
    #   4. /index.html (fallback SPA)
    location / {
        try_files $prerender_check $uri $uri/ /index.html;
    }

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}